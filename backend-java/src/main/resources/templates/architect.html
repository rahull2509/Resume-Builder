<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title th:text="${r.personal?.fullName != null and r.personal.fullName != '' ? r.personal.fullName : 'Resume'}">Resume</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Helvetica', sans-serif; color: #1C1B1A; font-size: 10pt; line-height: 1.5; background: #fff; }
.container { width: 100%; height: 100%; min-height: 297mm; overflow: hidden; }
.sidebar { float: left; width: 32%; background: #F2F6F4; padding: 16mm; min-height: 297mm; box-sizing: border-box; }
.main { float: right; width: 68%; padding: 16mm; box-sizing: border-box; }
h1 { font-size: 22pt; color: #1E3F33; margin: 0 0 4px; line-height: 1.1; }
.title { font-size: 11pt; color: #2A5746; margin-bottom: 24px; }
.h2-side { font-size: 10pt; text-transform: uppercase; color: #1E3F33; border-bottom: 2px solid #1E3F33; padding-bottom: 2px; margin: 24px 0 12px; font-weight: bold; }
.h2-main { font-size: 12pt; text-transform: uppercase; color: #1E3F33; border-bottom: 2px solid #1E3F33; padding-bottom: 2px; margin: 0 0 16px; font-weight: bold; }
.contact-item { margin-bottom: 6px; color: #2A5746; }
.section-main { margin-bottom: 24px; }
.item-main { margin-bottom: 16px; }
.item-header { clear: both; overflow: hidden; font-weight: bold; margin-bottom: 4px; }
.item-sub { color: #5C5A56; font-size: 9.5pt; margin-bottom: 4px; }
ul { margin: 4px 0 0 16px; }
li { margin-bottom: 3px; }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h1 th:text="${r.personal?.fullName != null and r.personal.fullName != '' ? r.personal.fullName : 'Your Name'}"></h1>
    <div class="title" th:text="${r.personal?.title}"></div>
    
    <div class="contact-item" th:if="${r.personal?.email != null and r.personal.email != ''}" th:text="${r.personal.email}"></div>
    <div class="contact-item" th:if="${r.personal?.phone != null and r.personal.phone != ''}" th:text="${r.personal.phone}"></div>
    <div class="contact-item" th:if="${r.personal?.location != null and r.personal.location != ''}" th:text="${r.personal.location}"></div>
    <div class="contact-item" th:if="${r.personal?.website != null and r.personal.website != ''}" th:text="${r.personal.website}"></div>

    <div th:if="${r.skills != null and !r.skills.isEmpty()}">
      <div class="h2-side">Skills</div>
      <div th:each="s : ${r.skills}" style="margin-bottom:12px;">
        <strong style="color:#2A5746" th:text="${s.category}"></strong>
        <div th:text="${#strings.listJoin(s.items, ', ')}"></div>
      </div>
    </div>

    <div th:if="${r.certifications != null and !r.certifications.isEmpty()}">
      <div class="h2-side">Certifications</div>
      <div th:each="c : ${r.certifications}" style="margin-bottom:12px;">
        <strong style="color:#2A5746" th:text="${c.name}"></strong>
        <div><span th:text="${c.issuer}"></span><span th:if="${c.date != null and c.date != ''}" th:text="' &middot; ' + ${c.date}"></span></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="section-main" th:if="${r.personal?.summary != null and r.personal.summary != ''}">
      <div class="h2-main">Profile</div>
      <div th:text="${r.personal.summary}"></div>
    </div>

    <div class="section-main" th:if="${r.experience != null and !r.experience.isEmpty()}">
      <div class="h2-main">Experience</div>
      <div class="item-main" th:each="e : ${r.experience}">
        <div class="item-header">
          <span th:text="${e.role} + ' &middot; ' + ${e.company}"></span>
          <span style="font-weight:normal; color:#5C5A56; float:right;">
             <span th:text="${e.startDate}"></span><span th:if="${e.startDate != null and e.startDate != '' and e.endDate != null and e.endDate != ''}"> &ndash; </span><span th:text="${e.endDate}"></span>
          </span>
        </div>
        <ul th:if="${e.bullets != null and !e.bullets.isEmpty()}">
          <li th:each="b : ${e.bullets}" th:text="${b}"></li>
        </ul>
      </div>
    </div>

    <div class="section-main" th:if="${r.education != null and !r.education.isEmpty()}">
      <div class="h2-main">Education</div>
      <div class="item-main" th:each="ed : ${r.education}">
        <div class="item-header">
          <span th:text="${ed.degree} + ' ' + ${ed.field}"></span>
          <span style="font-weight:normal; color:#5C5A56; float:right;">
             <span th:text="${ed.startDate}"></span><span th:if="${ed.startDate != null and ed.startDate != '' and ed.endDate != null and ed.endDate != ''}"> &ndash; </span><span th:text="${ed.endDate}"></span>
          </span>
        </div>
        <div class="item-sub" th:text="${ed.school}"></div>
      </div>
    </div>
    
    <div class="section-main" th:if="${r.projects != null and !r.projects.isEmpty()}">
      <div class="h2-main">Projects</div>
      <div class="item-main" th:each="p : ${r.projects}">
        <div class="item-header">
          <span th:text="${p.name}"></span>
          <span style="font-weight:normal; font-style:italic; color:#5C5A56; float:right;" th:text="${p.tech}"></span>
        </div>
        <div class="item-sub" th:text="${p.description}"></div>
        <ul th:if="${p.bullets != null and !p.bullets.isEmpty()}">
          <li th:each="b : ${p.bullets}" th:text="${b}"></li>
        </ul>
      </div>
    </div>

  </div>
</div>
</body>
</html>
